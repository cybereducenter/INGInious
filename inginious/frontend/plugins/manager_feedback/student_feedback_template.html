<!DOCTYPE html>
<html lang="he">

<head>

    <!-- Basic Page Needs ––––––––––––––––––––––––––––––––––––––––––––––––––-->
    <meta charset="utf-8">
    <title>Scenario Feedback</title>
    <meta name="description" content="scenario feedback">
    <meta name="author" content="">

    <!-- Mobile Specific Metas
        –––––––––––––––––––––––––––––––––––––––––––––––––– -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- FONT
        –––––––––––––––––––––––––––––––––––––––––––––––––– -->
    <link href="https://fonts.googleapis.com/css?family=Arimo" rel="stylesheet">


</head>

<body>

    <!-- Primary Page Layout
        –––––––––––––––––––––––––––––––––––––––––––––––––– -->
    <div id="scenarios-table-task_id_to_replace" class="table table-condensed feedback test-result-table">

    </div>

    <!--here will the modals be injected-->
    <table id="modals-task_id_to_replace">

    </table>

    <!-- End Document

        –––––––––––––––––––––––––––––––––––––––––––––––––– -->
    <script type="text/x-tmpl" id="tmpl-category">
        <div  id="feedback-{{%=o.category_eng%}}"
             class="displayed_feedback section category card mb-4">
             <div class="section_header category-header justify-content-end pr-3" onclick="dropdown(this)"
                 style="display: flex; margin: 5px; background-color: #5bc0de;">
                        <span class="title mr-auto" style="display: flex; color: #ffffff; font-weight: bold; padding-inline: 1.5rem">
                            <div>{{%=o.category%}}</div>
                        </span>
                        <span style="font-size: 1.5rem; color: #ffffff; padding-inline: 1.5rem"
                              class="dropdown_button fa fa-caret-left"></span>
            </div>
            <div >
                {{% if (o.feedback) {{ %}}
                    <div class="message-feedback-{{%=o.category_eng%}} message">
                        <span>{{%=o.feedback%}}</span>
                    </div>
                {{% }} %}}
            </div>
            <div id="feedback-{{%=o.category_eng%}}-tests" class="content list-group list-group-flush task-feedback" style="display:none;">

                <div class="test-container" style=" margin: 1.5rem">

                </div>
            </div>

        </div>
    </script>
    <script type="text/x-tmpl" id="tmpl-test">
        <div>
           <div id="{{%=o.name%}}" class="test-data displayed_test_feedback" data-result={{%=o.result.text%}}
                style="border-color:{{%=o.border_color%}}">
                <div class="test-section">
                    <div class="content col-md-9 col-xs-9 black-text" style="padding: 10px 5px">
                        <div class="pull-left" style="padding-inline: 1.5rem">
                            <div class="row" > {{%=o.name%}} </div>
                            <div class="row" > {{%=o.message%}} </div>
                        </div>
                    </div>
                    <div class="actions col-md-3 col-xs-3" style="padding-right: 0px">
                        <button class="btn btn-primary btn-info btn-sm show_cout_btn col-md-9 col-xs-9 pull-left"
                                type="button" onclick="FeedbackPlugin.add_popup(this)">
                            <div class="d-none d-sm-inline">פרטים נוספים</div>
                        </button>
                    </div>
                </div>
           </div>
        </div>
    </script>
    <script type="text/x-tmpl" id="tmpl-total-feedback">
        <div class="message" style="margin: 20px 0">
           <span>{{%=o%}}</span>
        </div>
    </script>
    <!--Template for a single scenario row -->
    <script type="text/x-tmpl" id="tmpl-scenario-row">
            <tr>
                <td class="col-md-1 col-xs-1 {{%=o.color%}}">

                    {{% if (!o.result.bool) {{ %}}
                        <i class="fa fa-times-circle-o feedback-icon" aria-hidden="true"></i>
                    {{% }} else {{ %}}
                        <i class="fa fa-check-circle-o feedback-icon" aria-hidden="true"></i>
                    {{% }} %}}
                </td>

                <td class="col-md-7 col-xs-7 black-text">
                    <div class="col-md-2 col-xs-2 pull-right">
                        #{{%=o.indexId%}}
                    </div>
                    <div class="col-md-10 col-xs-10 pull-right">
                        <div class="row"> {{%=o.name%}} </div>
                        <div class="row red-text">
                            {{% if (o.feedback) {{ %}}
                               {{%=o.feedback.text%}}
                            {{% }} %}}
                        </div>
                    </div>

                </td>
                <td class="col-md-2 col-xs-2">
                    <a href="#" class="feedback-cout" data-toggle="modal" data-target="#myModal{{%=o.id%}}">general output</a>
                </td>
                <td class="col-md-2 col-xs-2">
                    <a href="{{%=o.link%}}" class="feedback-link" target="_blank">פרטים נוספים</a>
                </td>
            </tr>
        </script>



    <script>
        // will be injected by run.py after run of scenarios
        var feedbackData = {feedback_json};
        console.log("feedbackData", feedbackData)
    </script>

    <script>
        var taskId = 'task_id_to_replace';
        FeedbackPlugin.renderGitlabRows(feedbackData);
    </script>

</body>

<script type="application/javascript">

    // }});


</script>

</html>
